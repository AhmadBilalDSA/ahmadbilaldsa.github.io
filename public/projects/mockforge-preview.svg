<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">MockForge Studio preview</title>
  <desc id="desc">System-design interview board schematic: React Flow canvas feeding a local heuristic scorer with on-device storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1626"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-opacity="0.6" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <circle cx="1010" cy="90" r="200" fill="#06B6D4" opacity="0.07"/>
  <circle cx="120" cy="470" r="220" fill="#10B981" opacity="0.06"/>

  <text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#22D3EE" letter-spacing="2">MOCKFORGE STUDIO</text>
  <text x="40" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748B">rust · tauri v2 · react flow · heuristic ai</text>

  <g font-family="Inter,system-ui,Segoe UI,sans-serif">
    <g filter="url(#glow)">
      <rect x="620" y="120" width="250" height="56" rx="14" fill="#111827" stroke="url(#edgeGrad)" stroke-width="2"/>
      <text x="745" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#F1F5F9">Heuristic Scorer</text>
      <text x="745" y="165" text-anchor="middle" font-size="10" fill="#10B981">grades on-device · rag-score 0-100</text>
    </g>

    <rect x="560" y="250" width="70" height="36" rx="10" fill="#0E7490" opacity="0.9"/>
    <text x="595" y="273" text-anchor="middle" font-size="10" fill="#E0F2FE">AI</text>

    <g>
      <rect x="100" y="120" width="340" height="70" rx="14" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="112" y="134" width="20" height="42" rx="6" fill="#06B6D4" opacity="0.85"/>
      <text x="148" y="150" font-size="12" font-weight="600" fill="#F1F5F9">React Flow · System Design Board</text>
      <text x="148" y="168" font-size="10" fill="#94A3B8">drag nodes · model architecture live</text>
    </g>

    <g>
      <rect x="120" y="240" width="140" height="52" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="190" y="264" text-anchor="middle" font-size="11" fill="#CBD5E1">Load Balancer</text>
      <text x="190" y="280" text-anchor="middle" font-size="9" fill="#64748B">stateless</text>
    </g>
    <g>
      <rect x="300" y="240" width="140" height="52" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="370" y="264" text-anchor="middle" font-size="11" fill="#CBD5E1">Service Mesh</text>
      <text x="370" y="280" text-anchor="middle" font-size="9" fill="#64748B">retry policy</text>
    </g>
    <g>
      <rect x="160" y="350" width="110" height="52" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="215" y="376" text-anchor="middle" font-size="11" fill="#CBD5E1">Cache</text>
      <text x="215" y="392" text-anchor="middle" font-size="9" fill="#64748B">ttl 60s</text>
    </g>
    <g>
      <rect x="320" y="350" width="130" height="52" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="385" y="376" text-anchor="middle" font-size="11" fill="#CBD5E1">Analytics Store</text>
      <text x="385" y="392" text-anchor="middle" font-size="9" fill="#64748B">append-only</text>
    </g>

    <g>
      <rect x="860" y="300" width="260" height="150" rx="14" fill="#101826" stroke="#1E293B" stroke-width="1.2"/>
      <text x="882" y="330" font-size="11" font-weight="600" fill="#E2E8F0">Smoke test report</text>
      <rect x="882" y="342" width="120" height="6" rx="3" fill="#1E293B"/><rect x="882" y="342" width="86" height="6" rx="3" fill="#10B981"/>
      <text x="1022" y="349" font-size="9" fill="#10B981">71%</text>
      <rect x="882" y="360" width="150" height="6" rx="3" fill="#1E293B"/><rect x="882" y="360" width="46" height="6" rx="3" fill="#06B6D4"/>
      <text x="1052" y="367" font-size="9" fill="#22D3EE">31%</text>
      <rect x="882" y="378" width="100" height="6" rx="3" fill="#1E293B"/><rect x="882" y="378" width="100" height="6" rx="3" fill="#FBBF24"/>
      <text x="1002" y="385" font-size="9" fill="#FBBF24">100%</text>
      <text x="882" y="410" font-size="9.5" fill="#94A3B8">swim lane · flows · throughput</text>
      <text x="882" y="428" font-size="9.5" fill="#10B981">✓ verdict: PASS</text>
    </g>

    <g>
      <rect x="100" y="160" width="260" height="150" rx="14" fill="#111827" stroke="#1E293B" stroke-width="1.2"/>
      <text x="122" y="190" font-size="11" font-weight="600" fill="#E2E8F0">Interview flow</text>
      <circle cx="128" cy="224" r="5" fill="#10B981"/>
      <text x="142" y="228" font-size="10" fill="#94A3B8">system-design brief</text>
      <circle cx="128" cy="250" r="5" fill="#38BDF8"/>
      <text x="142" y="254" font-size="10" fill="#94A3B8">candidate draws architecture</text>
      <circle cx="128" cy="276" r="5" fill="#FBBF24"/>
      <text x="142" y="280" font-size="10" fill="#94A3B8">local heuristic scoring</text>
      <text x="122" y="298" font-size="9" fill="#64748B">zero telemetry — stays on device</text>
    </g>
  </g>

  <path d="M 440 155 C 500 155 540 130 618 138" stroke="#1E293B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 870 162 C 880 220 880 230 872 286" stroke="#1E293B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 190 292 L 215 348" stroke="#1E293B" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 370 292 L 385 348" stroke="#1E293B" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
</svg>