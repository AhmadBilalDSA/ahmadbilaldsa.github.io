<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <pattern id="bg-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1e293b" opacity="0.4"/>
    </pattern>
    <radialGradient id="ambience" cx="20%" cy="6%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#0c1017"/>
  <rect width="600" height="340" fill="url(#bg-dots)"/>
  <rect width="600" height="340" fill="url(#ambience)"/>

  <text x="30" y="36" fill="#34d399" font-size="12.5" font-weight="600" letter-spacing="3">DUCK-DIFF · PRODUCTION DIFF PIPELINE</text>
  <rect x="410" y="20" width="160" height="26" rx="13" fill="#0d121c" stroke="#1e293b"/>
  <text x="424" y="37" fill="#94a3b8" font-size="11">GitHub Actions · headless</text>

  <!-- terminal window with macOS controls -->
  <rect x="40" y="62" width="520" height="218" rx="12" fill="#0c1017" stroke="#1e293b"/>
  <rect x="40" y="62" width="520" height="40" rx="12" fill="#111a29" stroke="#1e293b"/>
  <rect x="40" y="86" width="520" height="16" fill="#111a29"/>
  <circle cx="66" cy="82" r="5.5" fill="#ff5f56"/>
  <circle cx="87" cy="82" r="5.5" fill="#ffbd2e"/>
  <circle cx="108" cy="82" r="5.5" fill="#27c93f"/>
  <text x="300" y="87" fill="#64748b" font-size="12" text-anchor="middle">duck-diff — prod_v1.parquet → stage_v2.parquet</text>

  <!-- command + query -->
  <text x="60" y="124" fill="#64748b" font-size="12.5" font-weight="600">$</text>
  <text x="78" y="124" fill="#e2e8f0" font-size="12.5">duck-diff run --prod prod_v1 --stage stage_v2</text>
  <text x="60" y="148" fill="#475569" font-size="12.5">SELECT * FROM diff_scan('prod_v1.parquet', 'stage_v2.parquet')</text>
  <text x="60" y="170" fill="#475569" font-size="11.5">[scan] manifest ok · 3 keys · format parquet</text>

  <!-- inserted [OK] -->
  <rect x="60" y="184" width="480" height="28" rx="6" fill="#052e25"/>
  <text x="74" y="203" fill="#4ade80" font-size="12.5" font-weight="700">+ 1,420 rows inserted [OK]</text>

  <!-- mutated [ALERT] -->
  <rect x="60" y="218" width="480" height="28" rx="6" fill="#3f1113"/>
  <text x="74" y="237" fill="#f87171" font-size="12.5" font-weight="700">- 14 rows mutated [ALERT]</text>

  <!-- emerald CI/CD dispatch badge -->
  <g>
    <rect x="172" y="254" width="256" height="26" rx="13" fill="#052e25" stroke="#10b981" stroke-opacity="0.6"/>
    <circle cx="194" cy="267" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="208" y="272" fill="#6ee7b7" font-size="12" font-weight="700">CI/CD Dispatch: 200</text>
  </g>

  <!-- footer -->
  <text x="30" y="310" fill="#475569" font-size="11">duck-diff · prod_v1 → stage_v2 · reconciled 1,820 / 1,820 rows</text>
  <text x="516" y="310" fill="#34d399" font-size="11">● LIVE</text>
</svg>