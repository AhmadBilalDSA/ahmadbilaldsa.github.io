<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <pattern id="bg-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1e293b" opacity="0.4"/>
    </pattern>
    <radialGradient id="ambience" cx="72%" cy="6%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowdown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L5,10 L10,0 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#0c1017"/>
  <rect width="600" height="340" fill="url(#bg-dots)"/>
  <rect width="600" height="340" fill="url(#ambience)"/>

  <text x="30" y="36" fill="#38bdf8" font-size="12.5" font-weight="600" letter-spacing="3">SQLEAN-LINT PRO · AST INSPECTOR</text>
  <rect x="452" y="20" width="118" height="26" rx="13" fill="#0d121c" stroke="#1e293b"/>
  <text x="466" y="37" fill="#94a3b8" font-size="11">Python + SQLGlot</text>

  <!-- IDE panel: query.sql -->
  <rect x="30" y="64" width="252" height="212" rx="12" fill="#0d121c" stroke="#1e293b"/>
  <rect x="30" y="64" width="252" height="30" rx="12" fill="#111a29" stroke="#1e293b"/>
  <rect x="30" y="80" width="252" height="14" fill="#111a29"/>
  <circle cx="54" cy="79" r="4.4" fill="#ff5f56"/>
  <circle cx="72" cy="79" r="4.4" fill="#ffbd2e"/>
  <circle cx="90" cy="79" r="4.4" fill="#27c93f"/>
  <text x="140" y="83" fill="#64748b" font-size="11.5" text-anchor="middle">query.sql</text>

  <text x="50" y="118" fill="#7c3aed" font-size="12.5" font-weight="600">SELECT</text>
  <text x="72" y="118" fill="#e2e8f0" font-size="12.5"> o.id, o.total</text>
  <text x="50" y="140" fill="#7c3aed" font-size="12.5" font-weight="600">FROM</text>
  <text x="72" y="140" fill="#e2e8f0" font-size="12.5"> orders o</text>
  <text x="50" y="162" fill="#7c3aed" font-size="12.5" font-weight="600">WHERE</text>
  <text x="72" y="162" fill="#e2e8f0" font-size="12"> EXISTS (</text>
  <text x="72" y="184" fill="#64748b" font-size="12"> SELECT 1</text>
  <text x="72" y="202" fill="#64748b" font-size="12"> FROM regions r</text>
  <text x="72" y="220" fill="#64748b" font-size="12"> WHERE r.active)</text>
  <rect x="50" y="234" width="212" height="24" rx="12" fill="#2a1c05" stroke="#b45309" stroke-opacity="0.6"/>
  <text x="62" y="250" fill="#fbbf24" font-size="10.5">subquery → flatten recommended</text>

  <!-- AST tree panel -->
  <rect x="298" y="64" width="272" height="212" rx="12" fill="#0d121c" stroke="#155e75"/>
  <text x="316" y="88" fill="#38bdf8" font-size="10.5" letter-spacing="2">PARSED AST · MUTATION TRACE</text>

  <!-- Select -->
  <rect x="360" y="96" width="148" height="28" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="434" y="115" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Select</text>

  <!-- connector 1 -->
  <line x1="434" y1="124" x2="434" y2="146" stroke="#155e75" stroke-width="2"/>
  <line x1="434" y1="146" x2="434" y2="148" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowdown)"/>

  <!-- Where -->
  <rect x="360" y="152" width="148" height="28" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="434" y="171" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Where</text>

  <!-- dotted branch stub (tree look) -->
  <line x1="360" y1="166" x2="326" y2="166" stroke="#1e293b" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="316" y="162" fill="#475569" font-size="9">status=</text>
  <text x="316" y="172" fill="#475569" font-size="9">'active'</text>

  <!-- connector 2 -->
  <line x1="434" y1="180" x2="434" y2="202" stroke="#155e75" stroke-width="2"/>
  <line x1="434" y1="202" x2="434" y2="204" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowdown)"/>

  <!-- Subquery Flattened -->
  <rect x="342" y="208" width="184" height="28" rx="9" fill="#0e7490" fill-opacity="0.32" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="434" y="227" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">Subquery Flattened</text>

  <!-- connector 3 -->
  <line x1="434" y1="236" x2="434" y2="258" stroke="#155e75" stroke-width="2"/>
  <line x1="434" y1="258" x2="434" y2="260" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowdown)"/>

  <!-- IndexScan -->
  <rect x="356" y="264" width="156" height="28" rx="9" fill="#052e25" stroke="#10b981" stroke-opacity="0.7"/>
  <text x="434" y="283" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">IndexScan</text>

  <!-- green badge -->
  <g>
    <rect x="298" y="300" width="272" height="34" rx="17" fill="#052e25" stroke="#10b981" stroke-opacity="0.55"/>
    <circle cx="322" cy="317" r="9" fill="#10b981"/>
    <path d="M317.5 317 l3 3 l5 -5.5" stroke="#07090e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="322" fill="#6ee7b7" font-size="13" font-weight="700">AST Mutation: Optimal</text>
  </g>

  <text x="30" y="310" fill="#475569" font-size="11">COST: 11ns · 1 MUTATION APPLIED · LOCAL-FIRST</text>
</svg>