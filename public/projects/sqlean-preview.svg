<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <pattern id="bg-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1e293b" opacity="0.45"/>
    </pattern>
    <radialGradient id="ambience" cx="76%" cy="12%" r="75%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="340" fill="#07090e"/>
  <rect width="800" height="340" fill="url(#bg-dots)"/>
  <rect width="800" height="340" fill="url(#ambience)"/>

  <text x="34" y="44" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="3">SQLEAN-LINT PRO · AST LINTING PIPELINE</text>

  <!-- quarantine tag -->
  <rect x="600" y="24" width="166" height="28" rx="14" fill="#2a1c05" stroke="#b45309" stroke-opacity="0.6"/>
  <text x="614" y="43" fill="#fbbf24" font-size="12" font-weight="600">⚠ anti-pattern detected</text>

  <!-- source SQL window -->
  <rect x="34" y="96" width="258" height="152" rx="12" fill="#0d121c" stroke="#1e293b"/>
  <rect x="34" y="96" width="258" height="30" rx="12" fill="#111a29" stroke="#1e293b"/>
  <rect x="34" y="112" width="258" height="14" fill="#111a29"/>
  <circle cx="58" cy="111" r="4.4" fill="#f87171"/>
  <circle cx="76" cy="111" r="4.4" fill="#fbbf24"/>
  <circle cx="94" cy="111" r="4.4" fill="#4ade80"/>
  <text x="150" y="115" fill="#64748b" font-size="11.5" text-anchor="middle">query.sql</text>

  <text x="54" y="150" fill="#7c3aed" font-size="12.5" font-weight="600">SELECT</text>
  <text x="76" y="150" fill="#fbbf24" font-size="12.5"> SUM(price) AS total</text>
  <text x="54" y="172" fill="#7c3aed" font-size="12.5" font-weight="600">FROM</text>
  <text x="76" y="172" fill="#e2e8f0" font-size="12.5"> orders o</text>
  <text x="54" y="194" fill="#7c3aed" font-size="12.5" font-weight="600">JOIN</text>
  <text x="76" y="194" fill="#e2e8f0" font-size="12">(SELECT id FROM regions r</text>
  <text x="76" y="212" fill="#64748b" font-size="12">  WHERE r.active = TRUE) sub</text>

  <rect x="54" y="222" width="120" height="20" rx="10" fill="#3f1113"/>
  <text x="64" y="236" fill="#fca5a5" font-size="10.5">nested join · N+1</text>

  <!-- transform arrow -->
  <g>
    <line x1="312" y1="160" x2="452" y2="160" stroke="#155e75" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="312" y1="160" x2="452" y2="160" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" filter="url(#soft-glow)"
          stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.3s" repeatCount="indefinite"/>
    </line>
    <path d="M452 153 L466 160 L452 167 z" fill="#22d3ee"/>
    <text x="382" y="146" fill="#67e8f9" font-size="11.5" text-anchor="middle">SQLGlot</text>
    <text x="382" y="188" fill="#475569" font-size="10.5" text-anchor="middle">parse → AST</text>
  </g>

  <!-- AST panel -->
  <rect x="484" y="92" width="282" height="160" rx="12" fill="#0d121c" stroke="#155e75"/>
  <text x="502" y="116" fill="#38bdf8" font-size="11" letter-spacing="2">PARSED AST</text>

  <rect x="524" y="128" width="150" height="30" rx="9" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="599" y="148" fill="#cffafe" font-size="13" font-weight="700" text-anchor="middle">SELECT</text>

  <line x1="599" y1="158" x2="548" y2="196" stroke="#155e75" stroke-width="1.8"/>
  <line x1="599" y1="158" x2="599" y2="196" stroke="#155e75" stroke-width="1.8"/>
  <line x1="599" y1="158" x2="650" y2="196" stroke="#155e75" stroke-width="1.8"/>
  <circle cx="548" cy="196" r="3" fill="#22d3ee"/>
  <circle cx="599" cy="196" r="3" fill="#22d3ee"/>
  <circle cx="650" cy="196" r="3" fill="#22d3ee"/>
  <rect x="494" y="206" width="108" height="26" rx="8" fill="#0b1420" stroke="#1e293b"/>
  <text x="548" y="223" fill="#7dd3fc" font-size="11" text-anchor="middle">FROM ods_sales</text>
  <rect x="546" y="206" width="106" height="26" rx="8" fill="#0b1420" stroke="#1e293b"/>
  <text x="599" y="223" fill="#7dd3fc" font-size="11" text-anchor="middle">GROUP BY region</text>
  <rect x="598" y="206" width="164" height="26" rx="8" fill="#0b1420" stroke="#1e293b"/>
  <text x="599" y="223" fill="#7dd3fc" font-size="11" text-anchor="middle">WHERE status = 'paid'</text>

  <!-- green check pill -->
  <g>
    <rect x="484" y="262" width="282" height="34" rx="17" fill="#052e25" stroke="#10b981" stroke-opacity="0.55"/>
    <circle cx="508" cy="279" r="9" fill="#10b981"/>
    <path d="M503.5 279 l3 3 l5 -5.5" stroke="#07090e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="526" y="284" fill="#6ee7b7" font-size="13.5" font-weight="700">AST Lint: PASSED</text>
  </g>

  <text x="700" y="316" fill="#34d399" font-size="11.5">● CLEAN</text>
  <text x="34" y="316" fill="#475569" font-size="11.5">LOCAL-FIRST · PYTHON + SQLGlot · 0 NETWORK EGRESS</text>
</svg>